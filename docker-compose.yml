name: wagering

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://wagering_app:wagering_app@postgres:5432/wagering
  DATABASE_MIGRATION_URL: postgres://wagering_migrator:wagering_migrator@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_INPUT_QUEUE: wager-transactions.fifo
  SQS_DLQ_QUEUE: wager-transactions-dlq.fifo
  SQS_EVENTS_QUEUE: wager-events.fifo
  APP_ROLES: api,consumer,pending-worker,outbox-publisher

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering_migrator
      POSTGRES_PASSWORD: wagering_migrator
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering_migrator -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    environment:
      <<: *app-env
    command: ["bun", "run", "scripts/migrate.ts", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app1:
    build: .
    environment:
      <<: *app-env
      PORT: "3000"
      INSTANCE_ID: app1
    stop_grace_period: 45s
    ports:
      - "3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app2:
    build: .
    environment:
      <<: *app-env
      PORT: "3000"
      INSTANCE_ID: app2
    stop_grace_period: 45s
    ports:
      - "3002:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app3:
    build: .
    environment:
      <<: *app-env
      PORT: "3000"
      INSTANCE_ID: app3
    stop_grace_period: 45s
    ports:
      - "3003:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
